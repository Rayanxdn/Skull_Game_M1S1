spring.application.name=player-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skull}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skull}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update

# --- Sécurité JWT ---
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-env-file-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Compte administrateur initial ---
admin.email=${ADMIN_EMAIL:admin@skull.local}
admin.password=${ADMIN_PASSWORD:}
admin.pseudo=${ADMIN_PSEUDO:Admin}
