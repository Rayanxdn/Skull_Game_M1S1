spring.application.name=frontend
server.port=${SERVER_PORT:8080}
api.player-url=${PLAYER_API_URL:http://localhost:8081}

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# un nom de cookie par port : plusieurs instances du front sur localhost ne partagent pas leur session
server.servlet.session.cookie.name=SKULLSESSION-${SERVER_PORT:8080}
