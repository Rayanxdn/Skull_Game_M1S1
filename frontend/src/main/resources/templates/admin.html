<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administration')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1>Administration des joueurs</h1>
    <p class="subtitle">Un joueur banni ne peut plus se connecter et perd l'accès immédiatement.</p>
    <p th:if="${success}" class="alert alert-success" th:text="${success}"></p>
    <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

    <section class="panel">
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Pseudo</th><th>Email</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${players}">
                    <td th:text="${p['id']}"></td>
                    <td th:text="${p['pseudo']}"></td>
                    <td th:text="${p['email']}"></td>
                    <td>
                        <span class="badge" th:text="${p['banned']} ? 'Banni' : 'Actif'"
                              th:classappend="${p['banned']} ? 'badge-danger' : 'badge-ok'"></span>
                    </td>
                    <td>
                        <form th:action="@{/admin/players/{id}/ban(id=${p['id']})}" method="post">
                            <input type="hidden" name="banned" th:value="${!p['banned']}">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${p['banned']} ? 'btn-ok' : 'btn-danger'"
                                    th:text="${p['banned']} ? 'Débannir' : 'Bannir'"
                                    th:disabled="${p['id'] == selfId}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>Signalements des joueurs</h2>

        <p th:if="${reports == null}">
            Impossible de charger les signalements.
        </p>

        <p th:if="${reports != null and #lists.isEmpty(reports)}">
            Aucun signalement pour le moment.
        </p>

        <div class="table-wrap"
             th:if="${reports != null and !#lists.isEmpty(reports)}">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Joueur signalé</th>
                    <th>Signalé par</th>
                    <th>Motif</th>
                    <th>Partie</th>
                    <th>Date</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reports}">
                    <td th:text="${r['id']}"></td>
                    <td th:text="${r['reportedPlayerPseudo']}"></td>
                    <td th:text="${r['reporterPseudo']}"></td>
                    <td th:text="${r['reason']}"></td>
                    <td th:text="${r['gameId'] != null ? r['gameId'] : '-'}"></td>
                    <td th:text="${r['createdAt']}"></td>
                    <td>
                        <span class="badge"
                              th:text="${r['status'] == 'OPEN' ? 'Ouvert' : 'Traité'}"
                              th:classappend="${r['status'] == 'OPEN' ? 'badge-danger' : 'badge-ok'}">
                        </span>
                    </td>
                    <td>
                        <form th:if="${r['status'] == 'OPEN' and r['reportedPlayerId'] != selfId}"
                              th:action="@{/admin/players/{id}/ban(id=${r['reportedPlayerId']})}"
                              method="post">
                            <input type="hidden" name="banned" value="true">
                            <button type="submit" class="btn btn-sm btn-danger">
                                Bannir
                            </button>
                        </form>
                        <span th:if="${r['status'] == 'TREATED'}">
                            Traité
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
