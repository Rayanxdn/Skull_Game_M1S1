<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="auth-card">
    <h1>Connexion</h1>
    <p th:if="${success}" class="alert alert-success" th:text="${success}"></p>
    <p th:if="${info}" class="alert alert-info" th:text="${info}"></p>
    <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

    <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="username">
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Mot de passe</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="current-password">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button class="btn" type="submit">Se connecter</button>
    </form>
    <p class="subtitle" style="margin-top:1.2rem">Pas encore de compte ? <a th:href="@{/register}">S'inscrire</a></p>
</main>
</body>
</html>
