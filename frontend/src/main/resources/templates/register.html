<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="auth-card">
    <h1>Inscription</h1>
    <p th:if="${error}" class="alert alert-error" th:text="${error}"></p>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>
        <label for="pseudo">Pseudo</label>
        <input id="pseudo" type="text" th:field="*{pseudo}">
        <p class="field-error" th:if="${#fields.hasErrors('pseudo')}" th:errors="*{pseudo}"></p>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="username">
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Mot de passe (6 caractères minimum)</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password">
        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <button class="btn" type="submit">Créer mon compte</button>
    </form>
    <p class="subtitle" style="margin-top:1.2rem">Déjà inscrit ? <a th:href="@{/login}">Se connecter</a></p>
</main>
</body>
</html>
